; Лимиты PHP для формы заявки: к заявке можно приложить до 5 файлов по 20 МБ.
; post_max_size должен быть больше суммы всех файлов, иначе PHP отбросит
; данные формы целиком и заявка не дойдёт.
; Файл читает PHP в режиме FastCGI/FPM (так работает хостинг reg.ru).
upload_max_filesize = 20M
post_max_size = 110M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120
